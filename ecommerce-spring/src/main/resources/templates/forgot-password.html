<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password reset — SuperStyleShop</title><link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body><div class="page-shell">
    <div th:replace="~{fragments :: header}"></div>
    <main class="auth-card">
        <div th:replace="~{fragments :: messages}"></div>
        <p class="eyebrow">ACCOUNT HELP</p><h1>Reset password</h1>
        <p class="auth-intro">Enter the email associated with your account.</p>
        <form class="form-stack" th:action="@{/forgot-password}" method="post">
            <label>Email<input type="email" name="email" autocomplete="email" required></label>
            <button class="button button-dark full-button" type="submit">Request reset</button>
        </form>
        <p class="demo-disclaimer">This demo does not send email or change account passwords.</p>
        <a class="text-link continue-link" th:href="@{/login}">Back to log in</a>
    </main>
    <div th:replace="~{fragments :: footer}"></div>
</div></body>
</html>
